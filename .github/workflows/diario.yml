name: Radar de mercados (diario)

on:
  schedule:
    # 19:30 UTC = 21:30 en España (verano) / 20:30 (invierno).
    # OMIE ya publicó el precio de mañana, y OMIP y MIBGAS han cerrado sesión.
    - cron: '30 19 * * *'
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar mercados (OMIE + OMIP + MIBGAS)
        run: python scripts/actualizar_mercados.py

      - name: Publicar cambios
        run: |
          git config user.name  "ACZO Radar"
          git config user.email "radar@aczo.local"
          git add datos excel docs log.txt
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Radar: datos de $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Resumen de la ejecución
        if: always()
        run: tail -12 log.txt || echo "sin log"
